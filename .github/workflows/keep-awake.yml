name: Keep Render Services Awake

on:
  schedule:
    # Runs every 10 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoints
        run: |
          URLS=(
            "https://studytantra-mern-1.onrender.com/healthz"
            "https://studytantra-mern-1.onrender.com/health"
          )

          for url in "${URLS[@]}"; do
            echo "Pinging $url..."
            # --max-time 120 and --retry allows Render instances to wake up from cold starts (~40-60s)
            curl -fsS --retry 2 --retry-delay 5 --max-time 120 "$url" || echo "Failed to reach $url"
          done
